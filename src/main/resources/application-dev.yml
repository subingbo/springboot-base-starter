server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: campus
    password: campus123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s

campus:
  jwt:
    secret: dev-only-change-me-campus-jwt-secret-key-32bytes-min
    access-token-expiration: 1800
    refresh-token-expiration: 604800
  auth:
    captcha-enabled: true
    max-login-fail: 5
    lock-minutes: 15
    register-enabled: true
    password-min-length: 8
    password-max-length: 32
    refresh-grace-seconds: 10
  security:
    trust-proxy-headers: false
    admin-role-code: ADMIN
    rate-limit-enabled: true
    repeat-submit-enabled: true
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  file:
    upload-dir: ./uploads
    max-size-mb: 10
    image-max-pixels: 25000000
    public-url-prefix: /uploads
    import-max-rows: 5000
  log:
    slow-sql-ms: 500

logging:
  level:
    com.campus: debug
