server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:campus}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:campus}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3s

campus:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  auth:
    captcha-enabled: ${CAPTCHA_ENABLED:true}
    max-login-fail: ${MAX_LOGIN_FAIL:5}
    lock-minutes: ${LOCK_MINUTES:15}
    register-enabled: ${REGISTER_ENABLED:false}
    password-min-length: 8
    password-max-length: 32
    refresh-grace-seconds: ${REFRESH_GRACE_SECONDS:10}
  security:
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
    admin-role-code: ADMIN
    rate-limit-enabled: true
    repeat-submit-enabled: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  file:
    upload-dir: ${UPLOAD_DIR:/app/uploads}
    max-size-mb: ${FILE_MAX_SIZE_MB:10}
    image-max-pixels: 25000000
    public-url-prefix: /uploads
    import-max-rows: 5000
  log:
    slow-sql-ms: 500

springdoc:
  api-docs:
    enabled: false
knife4j:
  enable: false

logging:
  level:
    root: info
    com.campus: info
